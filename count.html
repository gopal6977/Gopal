<html>
<head>
<script>
function sort()
{
var n,i,j,c=0;
a=new Array(50);
n=prompt("Enter no of Element : ","");
for(i=0;i<n;i++)
a[i]=prompt("Enter Element : ","");
document.write("<br>"+"Given Element are ");
for(i=0;i<n;i++)
document.write("<br>"+a[i]);
x=prompt("Enter search Element : ","");
for(i=0;i<n;i++){
if(a[i]==x)
{
c+=1;
}
}
if(c==0){

document.write("<br>"+"Element Not Present");
}
else{

document.write("<br>"+"Element"+x+"present"+c+"times");
}
}
</script>
</head>
<body bgcolor="pink">
<h1 align="center">Number of occurance in given number</h1>
<input type="button" value="count" onclick=sort()></br>
</body>
</html>
